name: Deploy approved Azure API
on:
  workflow_dispatch:
    inputs:
      function_app_name:
        description: Existing approved Function App in the personal subscription
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm api:package
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply migrations to the approved private database
        env:
          DATABASE_URL: ${{ secrets.API_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Set API_DATABASE_URL for the approved database before deployment."
            exit 1
          fi
          pnpm db:migrate
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.function_app_name }}
          package: api
          sku: flexconsumption
          respect-funcignore: true
