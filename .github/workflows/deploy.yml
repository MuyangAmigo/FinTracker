name: Build and deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  AZURE_WEBAPP_NAME: fintracker-jl

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build Next.js
        run: pnpm run build
        env:
          # The build pulls in @prisma/client which needs DATABASE_URL to be
          # *defined* (not necessarily reachable) so build doesn't crash on
          # the schema check. We pass the real one as a runtime env on the
          # App Service side, not during the GitHub-hosted build.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_URL: https://fintracker-jl.azurewebsites.net
          NEXTAUTH_SECRET: build-time-placeholder-replaced-at-runtime

      - name: Assemble standalone bundle
        run: |
          mkdir -p deploy
          # Next.js standalone server.js + minimal node_modules.
          cp -r .next/standalone/. deploy/
          # Static assets and Prisma engines that standalone doesn't auto-include.
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          # Prisma needs the schema and the query-engine binary at runtime.
          mkdir -p deploy/prisma
          cp prisma/schema.prisma deploy/prisma/schema.prisma
          cp -r node_modules/.prisma deploy/node_modules/.prisma
          cp -r node_modules/@prisma deploy/node_modules/@prisma
          # Tell App Service how to start.
          cat > deploy/package.json <<'JSON'
          { "name": "fintracker", "private": true, "scripts": { "start": "node server.js" } }
          JSON
          du -sh deploy

      - name: Package artifact
        working-directory: deploy
        run: zip -rq ../release.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: release.zip
