name: Build and deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  AZURE_WEBAPP_NAME: fintracker-jl

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # `node-linker=hoisted` flattens node_modules into the npm-style
        # layout. The pnpm-default symlink layout doesn't survive Kudu's
        # tar+extract repack on Linux App Service, leading to
        # `Cannot find module '@swc/helpers/_/_interop_require_default'`
        # at runtime when Next loads from `/node_modules/next/`.
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build Next.js
        run: pnpm run build
        env:
          # The build pulls in @prisma/client which needs DATABASE_URL to be
          # *defined* (not necessarily reachable) so build doesn't crash on
          # the schema check. We pass the real one as a runtime env on the
          # App Service side, not during the GitHub-hosted build.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_URL: https://fintracker-jl.azurewebsites.net
          NEXTAUTH_SECRET: build-time-placeholder-replaced-at-runtime

      - name: Assemble standalone bundle
        run: |
          # Static assets and the prisma schema aren't included by Next's
          # standalone tracer; copy them in next to server.js.
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          mkdir -p .next/standalone/prisma
          cp prisma/schema.prisma .next/standalone/prisma/schema.prisma
          # App Service expects an `npm start` script.
          cat > .next/standalone/package.json <<'JSON'
          { "name": "fintracker", "private": true, "scripts": { "start": "node server.js" } }
          JSON
          du -sh .next/standalone

      - name: Package artifact
        working-directory: .next/standalone
        run: zip -rq "$GITHUB_WORKSPACE/release.zip" .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: release.zip
          # `clean: true` purges /home/site/wwwroot before extracting the
          # new package, so previous-deploy artifacts (oryx-manifest.toml,
          # node_modules.tar.gz, stale source trees) can't accumulate.
          clean: true
          restart: true
          # Bypass Oryx auto-detection by running server.js directly.
          startup-command: "node server.js"
